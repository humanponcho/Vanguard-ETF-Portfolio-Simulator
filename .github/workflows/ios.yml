name: iOS

# The engine is a plain Swift package, so it builds and tests on a runner with
# no simulator and no signing. That is the whole point of the package/app split
# from Stage 01 — CI on the code that carries the risk stays fast and free of
# Xcode project state.

on:
  push:
    branches: [master, 'claude/**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: SimulationKit · build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Report toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        working-directory: ios/SimulationKit
        run: swift build --build-tests

      - name: Test
        working-directory: ios/SimulationKit
        run: swift test --enable-code-coverage

      - name: Coverage summary
        working-directory: ios/SimulationKit
        run: |
          BIN=$(swift build --show-bin-path)
          PROF="$BIN/codecov/default.profdata"
          # The test bundle name differs between toolchains; find it rather
          # than hardcoding a path that breaks on the next Xcode.
          BUNDLE=$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)
          if [ -n "$BUNDLE" ] && [ -f "$PROF" ]; then
            xcrun llvm-cov report \
              "$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)" \
              -instr-profile "$PROF" \
              -ignore-filename-regex='(Tests|\.build)/' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage data found — skipping." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        # --strict promotes every warning to an error. A lint warning that
        # never has to be fixed is a lint warning everybody learns to ignore.
        run: swiftlint lint --strict --config ios/.swiftlint.yml

  format:
    name: swift-format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Check formatting
        # swift-format ships with the toolchain from Xcode 16.
        run: |
          swift format lint \
            --configuration ios/.swift-format \
            --recursive --strict \
            ios/SimulationKit/Sources ios/SimulationKit/Tests ios/Ballast

  app:
    name: Ballast · build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Does the Xcode project exist yet?
        id: probe
        run: |
          if [ -d ios/Ballast.xcodeproj ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project yet — create it per ios/README.md (Stage 01)." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select Xcode
        if: steps.probe.outputs.exists == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build for simulator
        if: steps.probe.outputs.exists == 'true'
        working-directory: ios
        run: |
          xcodebuild build \
            -project Ballast.xcodeproj \
            -scheme Ballast \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
